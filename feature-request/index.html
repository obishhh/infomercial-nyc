<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Infomercial &middot; Feature request</title>
<meta name="description" content="Something you'd like Infomercial to do? Say it here.">
<meta name="theme-color" content="#FBFAF5">
<!-- The one page on the site that sends anything anywhere: what is typed
     here, to the website's own database, which is not the app's. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self'; connect-src https://sevwmqmzawqldbnoyeng.supabase.co; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<link rel="canonical" href="https://infomercial.nyc/feature-request/">
<!-- Set like Support, Terms and Privacy, with a form: two boxes on the
     paper and a key, inverted while it is down. -->
<style>
  html { -webkit-text-size-adjust: 100%; }
  body { background: #FBFAF5; color: #0E1440;
         font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
         max-width: 620px; margin: 0 auto; padding: 48px 20px; line-height: 1.55; }
  h1 { color: #1B33D6; font-size: 34px; line-height: 1.1; margin: 0 0 4px; }
  h1 + .quiet { border-bottom: 2px solid #1B33D6; margin: 0 0 24px; padding-bottom: 14px; }
  .quiet { color: rgba(14, 20, 64, 0.62); font-size: 13px; }
  a { color: #1B33D6; }
  hr { border: 0; border-top: 1px solid rgba(27, 51, 214, 0.22); margin: 36px 0 20px; }
  h1 { position: relative; }
  .back { position: absolute; right: 100%; top: calc(50% - 1px); transform: translateY(-50%);
          display: flex; align-items: center; justify-content: flex-end; box-sizing: border-box;
          width: 40px; height: 44px; padding-right: 11px; color: #1B33D6;
          -webkit-tap-highlight-color: transparent; }
  @media (max-width: 691px) { body { padding-left: 36px; } }
  .back svg { width: 11px; height: 20px; overflow: visible; fill: none; stroke: currentColor;
              stroke-width: 2.8; stroke-linecap: square; }
  .back:hover, .back:active { background: #1B33D6; color: #fff; }
  .back:focus-visible { outline: 2px solid #1B33D6; outline-offset: 3px; }

  /* What each box asks, in the blue of a question on Support. */
  label { display: block; margin: 24px 0 8px; color: #1B33D6; font-weight: 700; line-height: 1.25; }
  form > label:first-of-type { margin-top: 0; }
  label .optional { margin-left: 6px; color: rgba(14, 20, 64, 0.62); font-size: 13px; font-weight: 400; }
  /* A box is an outline on the paper, square, at a size a phone types in
     without zooming. */
  textarea, input { display: block; box-sizing: border-box; width: 100%; margin: 0; padding: 10px 12px;
                    border: 2px solid #1B33D6; border-radius: 0; background: #fff; color: #0E1440;
                    font: 16px/1.45 'Helvetica Neue', Helvetica, Arial, sans-serif;
                    -webkit-appearance: none; appearance: none; }
  textarea { min-height: 150px; resize: vertical; }
  textarea:focus, input:focus { outline: 2px solid #1B33D6; outline-offset: 2px; }
  ::placeholder { color: rgba(14, 20, 64, 0.4); }
  /* A field a person never sees. Something filling every box in fills it,
     and nothing is sent. */
  .trap { position: absolute; left: -10000px; width: 1px; height: 1px; overflow: hidden; }

  /* The key, and beside it what came of pressing it. */
  .send { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin-top: 20px; }
  button { height: 44px; padding: 0 22px; border: 2px solid #1B33D6; border-radius: 0;
           background: #FBFAF5; color: #1B33D6; font: 700 15px/1 'Helvetica Neue', Helvetica, Arial, sans-serif;
           cursor: pointer; -webkit-appearance: none; appearance: none; -webkit-tap-highlight-color: transparent; }
  button:active { background: #1B33D6; color: #fff; }
  @media (hover: hover) { button:hover { background: #1B33D6; color: #fff; } }
  button:focus-visible { outline: 2px solid #1B33D6; outline-offset: 3px; }
  button:disabled { opacity: .5; cursor: default; background: #FBFAF5; color: #1B33D6; }
  .said { margin: 0; font-size: 15px; }
  .said.fault { color: #D92027; }
  form + .quiet { margin-top: 20px; }
  /* The small print, as the front page has it: the pages about what's
     next, a rule, then the three about the app, and no dots. On a phone
     the rule is the break between two lines. */
  .foot a { white-space: nowrap; }
  .foot a + a, .foot .bar, .foot .bar + a { margin-left: 14px; }
  .foot .bar { color: rgba(14, 20, 64, 0.3); }
  @media (max-width: 559px) {
    .foot .bar { display: block; height: 6px; margin: 0; overflow: hidden; color: transparent; }
    .foot .bar + a { margin-left: 0; }
  }
</style>
</head>
<body>
<h1><a class="back" href="../" aria-label="Back to the front page"><svg viewBox="0 0 12 22" aria-hidden="true"><polyline points="10,2 2,11 10,20"/></svg></a>Feature request</h1>
<p class="quiet">Infomercial &middot; A person reads every one</p>

<form id="request" novalidate>
  <label for="words">What should it do?</label>
  <textarea id="words" name="words" maxlength="1000" placeholder="Something you'd like, or something you'd change."></textarea>

  <label for="contact">How can we reach you?<span class="optional">optional</span></label>
  <input id="contact" name="contact" type="text" maxlength="200" autocomplete="email" autocapitalize="off" spellcheck="false" placeholder="Email or @handle">

  <div class="trap" aria-hidden="true">
    <label for="website">Leave this empty</label>
    <input id="website" name="website" type="text" tabindex="-1" autocomplete="off">
  </div>

  <div class="send">
    <button id="send" type="submit">Send</button>
    <p class="said" id="said" role="status" aria-live="polite"></p>
  </div>
  <noscript><p class="said fault">This form needs JavaScript. Or email
  <a href="mailto:desk@infomercial.nyc">desk@infomercial.nyc</a>.</p></noscript>
</form>
<p class="quiet">What you send is kept so we can read it, with nothing else about you.
See the <a href="../privacy/">Privacy Policy</a>.</p>

<hr>
<p class="quiet foot"><a href="../release-notes/">Release notes</a><span class="bar" aria-hidden="true">|</span><a href="../support/">Support</a><a href="../privacy/">Privacy Policy</a><a href="../terms/">Terms</a></p>

<script src="request.js?v=1"></script>
</body>
</html>
