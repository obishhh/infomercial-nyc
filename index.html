<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Infomercial</title>
<meta name="description" content="Post no spoilers. Watch at your own pace. The group chat can't hurt you here.">
<meta name="theme-color" content="#FBFAF5">
<!-- On an iPhone, Safari offers the app itself across the top of the page. -->
<meta name="apple-itunes-app" content="app-id=6814215735">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<!-- The icon in a browser tab: the bars alone, since the name across them
     would only blur that small. -->
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<!-- The icon a phone puts on a home screen or beside a message, which is the
     app's own. -->
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<!-- What a link to the site shows when it is texted or posted: the bill and,
     beside it, the app out now on the App Store. The ?v= on the picture goes
     up whenever it changes, so nothing that keeps an old card shows it again. -->
<link rel="canonical" href="https://infomercial.nyc/">
<meta property="og:type" content="website">
<meta property="og:url" content="https://infomercial.nyc/">
<meta property="og:site_name" content="Infomercial">
<meta property="og:title" content="Infomercial · Available now on the App Store">
<meta property="og:description" content="Available now on the App Store. Post no spoilers. Watch at your own pace. The group chat can't hurt you here.">
<meta property="og:image" content="https://infomercial.nyc/preview.png?v=2">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="A blue bill taped to the wall: Notice, New York, N.Y. Post no spoilers. Watch at your own pace. The group chat can't hurt you here. infomercial.nyc. Beside it, under the colour bars, the Infomercial icon: Available now, Download on the App Store.">
<meta name="twitter:card" content="summary_large_image">
<!-- The ?v= on the sheet and the scripts goes up whenever that file changes,
     so a browser never pairs this page with a copy it kept from before. -->
<link rel="stylesheet" href="site.css?v=17">
</head>
<body>

<!-- One page, one screen: a bill posted on the paper, the way to the app, and
     the small print. Nothing scrolls. -->
<main class="wall">
  <!-- The launch posters, one up at a time, each its own bill on the wall.
       Two keys slide the next one on, round and round. The crosswalk is
       the one up when the page opens, so its picture is fetched at once;
       the rest are fetched as they come next in line. -->
  <section class="stage" id="stage" aria-roledescription="carousel" aria-label="Launch posters" aria-live="polite">
    <div class="slot" aria-roledescription="slide" aria-label="Poster 1 of 9">
      <div class="bill pic t9"><img src="posters/crosswalk.webp" width="1080" height="1350" alt="Spoilers? Fuhgeddaboudit. Two people crossing a New York crosswalk seen from above, its stripes numbered as a season from E1 to E12: you at E3, a friend at E6. infomercial.nyc"><i class="tape a" aria-hidden="true"></i><i class="tape b" aria-hidden="true"></i></div>
    </div>
    <div class="slot" aria-roledescription="slide" aria-label="Poster 2 of 9" hidden>
      <div class="bill t1">
        <i class="tape a" aria-hidden="true"></i>
        <i class="tape b" aria-hidden="true"></i>
        <div class="sheet">
          <p class="osd notice">Notice &middot; New York, N.Y.</p>
          <h1 class="tall"><span>Post no</span><span>spoilers</span></h1>
          <p class="voice">Watch at your own pace.<br>The group chat can't hurt you here.</p>
          <p class="osd name">infomercial.nyc</p>
        </div>
      </div>
    </div>
    <div class="slot" aria-roledescription="slide" aria-label="Poster 3 of 9" hidden>
      <div class="bill pic t2"><img data-src="posters/boroughs.webp" width="1080" height="1350" alt="Not to scale. The five boroughs drawn in blocks, each on a different episode: the Bronx on S4E1, Manhattan on S3E8, Queens on S1E9, Brooklyn on S2E5, Staten Island on S1E1. Nobody's on the same episode. How far are you up to? infomercial.nyc"><i class="tape a" aria-hidden="true"></i><i class="tape b" aria-hidden="true"></i></div>
    </div>
    <div class="slot" aria-roledescription="slide" aria-label="Poster 4 of 9" hidden>
      <div class="bill pic t3"><img data-src="posters/coming-up.webp" width="1080" height="1350" alt="A fire escape on a brick building, printed in yellow. Coming up. infomercial.nyc"><i class="tape a" aria-hidden="true"></i><i class="tape b" aria-hidden="true"></i></div>
    </div>
    <div class="slot" aria-roledescription="slide" aria-label="Poster 5 of 9" hidden>
      <div class="bill pic t4"><img data-src="posters/happened.webp" width="1080" height="1350" alt="Has this ever happened to you? Sunday 9:02 PM, the group chat. Are you caught up? No, on episode 5, don't say anything. OK OK OK. Wait so when she dies in episode 8. Infomercial, over the colour bars. There's got to be a better way. infomercial.nyc"><i class="tape a" aria-hidden="true"></i><i class="tape b" aria-hidden="true"></i></div>
    </div>
    <div class="slot" aria-roledescription="slide" aria-label="Poster 6 of 9" hidden>
      <div class="bill pic t5"><img data-src="posters/laundromat.webp" width="1080" height="1350" alt="A row of laundromat dryers, each window a blue screen on a different episode: S1E3, S3E8, S2E1, S4E2, S2E5 and S1E9. Everyone's on a different cycle. Watch at your own pace. infomercial.nyc"><i class="tape a" aria-hidden="true"></i><i class="tape b" aria-hidden="true"></i></div>
    </div>
    <div class="slot" aria-roledescription="slide" aria-label="Poster 7 of 9" hidden>
      <div class="bill pic t6"><img data-src="posters/tile.webp" width="1080" height="1350" alt="Episode 5, set in subway tile. Get off at your stop. The finale isn't going anywhere. infomercial.nyc"><i class="tape a" aria-hidden="true"></i><i class="tape b" aria-hidden="true"></i></div>
    </div>
    <div class="slot" aria-roledescription="slide" aria-label="Poster 8 of 9" hidden>
      <div class="bill pic t7"><img data-src="posters/wait.webp" width="1080" height="1350" alt="The angel on Bethesda Fountain in Central Park, shown up to the sixth of ten blocks, with the rest as snow. Worth the wait. You'll see the rest when you get there. infomercial.nyc"><i class="tape a" aria-hidden="true"></i><i class="tape b" aria-hidden="true"></i></div>
    </div>
    <div class="slot" aria-roledescription="slide" aria-label="Poster 9 of 9" hidden>
      <div class="bill pic t8"><img data-src="posters/stops.webp" width="1080" height="1350" alt="Season 2 Local, all stops. You are here, at episode 5, and three friends at episode 8. Your friends are three stops ahead. Nobody's saying a word. Making all stops. infomercial.nyc"><i class="tape a" aria-hidden="true"></i><i class="tape b" aria-hidden="true"></i></div>
    </div>

    <!-- The two keys that change it: either side of it, or under it on a
         phone. -->
    <button class="arrow prev" id="prev" type="button" aria-label="Previous poster" hidden><svg viewBox="0 0 20 16" aria-hidden="true"><path d="M19 8H1M8 1L1 8l7 7"/></svg></button>
    <button class="arrow next" id="next" type="button" aria-label="Next poster" hidden><svg viewBox="0 0 20 16" aria-hidden="true"><path d="M1 8h18M12 1l7 7-7 7"/></svg></button>
  </section>

  <!-- Under the bill, the one loud thing on the wall: the app, out now, and
       the way to it on Apple's own badge. All of it is the one link. -->
  <div class="row">
    <a class="store" href="https://apple.co/4z1C3vC" aria-label="Infomercial is available now. Download on the App Store">
      <span class="app"><img src="icon.svg" width="1024" height="1024" alt=""></span>
      <span class="pitch">
        <span class="osd now">Available now</span>
        <img class="badge" src="app-store.svg" width="120" height="40" alt="">
      </span>
    </a>
  </div>
</main>

<!-- The foot: the small print. -->
<nav class="links" aria-label="The small print">

</nav>

<script src="posters.js?v=2"></script>
</body>
</html>
