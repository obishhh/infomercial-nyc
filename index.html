<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Infomercial</title>
<meta name="description" content="Post no spoilers. Watch at your own pace. The group chat can't hurt you here.">
<meta name="theme-color" content="#FBFAF5">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="site.css">
</head>
<body>

<!-- The crayon the pips are drawn in. -->
<svg class="defs" width="0" height="0" aria-hidden="true">
  <defs>
    <filter id="c1" x="-15%" y="-15%" width="130%" height="130%"><feTurbulence type="fractalNoise" baseFrequency="0.09" numOctaves="2" seed="5" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3"/></filter>
    <filter id="c2" x="-15%" y="-15%" width="130%" height="130%"><feTurbulence type="fractalNoise" baseFrequency="0.11" numOctaves="2" seed="11" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3.4"/></filter>
  </defs>
</svg>

<!-- One page, one screen: a bill posted on the paper, what is coming, and
     the small print. Nothing scrolls. -->
<main class="wall">
  <div class="bill">
    <i class="tape a" aria-hidden="true"></i>
    <i class="tape b" aria-hidden="true"></i>
    <div class="sheet">
      <p class="osd notice">Notice &middot; New York, N.Y.</p>
      <h1 class="tall"><span>Post no</span><span>spoilers</span></h1>
      <p class="voice">Watch at your own pace.<br>The group chat can't hurt you here.</p>
      <p class="osd name">infomercial.nyc</p>
    </div>
  </div>

  <!-- One line under the bill, and it is always the same height: the pips
       and what is coming, the pips and somewhere to type the password, or
       the way in. -->
  <div class="row" id="row" data-state="soon">
    <div class="line">
      <!-- The app's four pips, coloured in one at a time: a ring until it is
           filled, a disc once it is. -->
      <svg class="pips" viewBox="0 0 85 22" aria-hidden="true">
        <g class="rings" filter="url(#c2)" fill="none" stroke="#1B33D6" stroke-width="1.7"><circle class="r1" cx="11" cy="11" r="7.4"/><circle class="r2" cx="32" cy="10.4" r="7.4"/><circle class="r3" cx="53" cy="11.5" r="7.4"/><circle class="r4" cx="74" cy="10.8" r="7.4"/></g>
        <g class="discs" filter="url(#c1)" fill="#D92027"><circle class="d1" cx="11" cy="11" r="7.8"/><circle class="d2" cx="32" cy="10.4" r="7.8"/><circle class="d3" cx="53" cy="11.5" r="7.8"/><circle class="d4" cx="74" cy="10.8" r="7.8"/></g>
      </svg>
      <!-- The two take the same room, so the pips never move. -->
      <div class="say">
        <p class="soon">Coming soon to the App Store</p>
        <div class="ask">
          <input class="word" id="word" type="text" placeholder="password here" aria-label="Early access password" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="go">
          <button class="mini" id="enter" type="button">Enter</button>
          <button class="mini" id="nvm" type="button" aria-label="Never mind">NVM</button>
        </div>
      </div>
    </div>
    <a class="key loud" id="in" href="#">Open TestFlight</a>
  </div>
</main>

<!-- The foot: the way in early, and the small print. -->
<nav class="links" aria-label="Early access and the small print">
  <button id="early" type="button" aria-expanded="false" aria-controls="row">Early access</button>
  <span class="small">
    <a href="https://obishhh.github.io/rabbitears-site/">Support</a>
    <a href="https://obishhh.github.io/rabbitears-site/terms.html">Terms</a>
    <a href="https://obishhh.github.io/rabbitears-site/privacy.html">Privacy</a>
  </span>
</nav>

<script src="site.js"></script>
</body>
</html>
