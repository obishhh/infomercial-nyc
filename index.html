<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Infomercial</title>
<meta name="description" content="Post no spoilers. Watch at your own pace. The group chat can't hurt you here.">
<meta name="theme-color" content="#FBFAF5">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<!-- The icon a phone puts on a home screen or beside a message, which is the
     app's own. -->
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<!-- What a link to the site shows when it is texted or posted: the bill, wide. -->
<link rel="canonical" href="https://infomercial.nyc/">
<meta property="og:type" content="website">
<meta property="og:url" content="https://infomercial.nyc/">
<meta property="og:site_name" content="Infomercial">
<meta property="og:title" content="Infomercial">
<meta property="og:description" content="Post no spoilers. Watch at your own pace. The group chat can't hurt you here.">
<meta property="og:image" content="https://infomercial.nyc/preview.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="A blue bill taped to the wall: Notice, New York, N.Y. Post no spoilers. Watch at your own pace. The group chat can't hurt you here. infomercial.nyc">
<meta name="twitter:card" content="summary_large_image">
<!-- The ?v= on the sheet and the scripts goes up whenever that file changes,
     so a browser never pairs this page with a copy it kept from before. -->
<link rel="stylesheet" href="site.css?v=2">
</head>
<body>

<!-- The crayon the pips are drawn in. -->
<svg class="defs" width="0" height="0" aria-hidden="true">
  <defs>
    <filter id="c1" x="-15%" y="-15%" width="130%" height="130%"><feTurbulence type="fractalNoise" baseFrequency="0.09" numOctaves="2" seed="5" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3"/></filter>
    <filter id="c2" x="-15%" y="-15%" width="130%" height="130%"><feTurbulence type="fractalNoise" baseFrequency="0.11" numOctaves="2" seed="11" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3.4"/></filter>
  </defs>
</svg>

<!-- One page, one screen: a bill posted on the paper, what is coming, and
     the small print. Nothing scrolls. -->
<main class="wall">
  <!-- The launch posters, one up at a time, each its own bill on the wall.
       Two keys slide the next one on, round and round. -->
  <section class="stage" id="stage" aria-roledescription="carousel" aria-label="Launch posters" aria-live="polite">
    <div class="slot" aria-roledescription="slide" aria-label="Poster 1 of 8">
      <div class="bill t1">
        <i class="tape a" aria-hidden="true"></i>
        <i class="tape b" aria-hidden="true"></i>
        <div class="sheet">
          <p class="osd notice">Notice &middot; New York, N.Y.</p>
          <h1 class="tall"><span>Post no</span><span>spoilers</span></h1>
          <p class="voice">Watch at your own pace.<br>The group chat can't hurt you here.</p>
          <p class="osd name">infomercial.nyc</p>
        </div>
      </div>
    </div>
    <div class="slot" aria-roledescription="slide" aria-label="Poster 2 of 8" hidden>
      <div class="bill pic t2"><img data-src="posters/boroughs.webp" width="1080" height="1350" alt="Not to scale. The five boroughs drawn in blocks, each on a different episode: the Bronx on S4E1, Manhattan on S3E8, Queens on S1E9, Brooklyn on S2E5, Staten Island on S1E1. Nobody's on the same episode. How far are you up to? infomercial.nyc"><i class="tape a" aria-hidden="true"></i><i class="tape b" aria-hidden="true"></i></div>
    </div>
    <div class="slot" aria-roledescription="slide" aria-label="Poster 3 of 8" hidden>
      <div class="bill pic t3"><img data-src="posters/coming-up.webp" width="1080" height="1350" alt="A fire escape on a brick building, printed in yellow. Coming up. infomercial.nyc"><i class="tape a" aria-hidden="true"></i><i class="tape b" aria-hidden="true"></i></div>
    </div>
    <div class="slot" aria-roledescription="slide" aria-label="Poster 4 of 8" hidden>
      <div class="bill pic t4"><img data-src="posters/happened.webp" width="1080" height="1350" alt="Has this ever happened to you? Sunday 9:02 PM, the group chat. Are you caught up? No, on episode 5, don't say anything. OK OK OK. Wait so when she dies in episode 8. Infomercial, over the colour bars. There's got to be a better way. infomercial.nyc"><i class="tape a" aria-hidden="true"></i><i class="tape b" aria-hidden="true"></i></div>
    </div>
    <div class="slot" aria-roledescription="slide" aria-label="Poster 5 of 8" hidden>
      <div class="bill pic t5"><img data-src="posters/laundromat.webp" width="1080" height="1350" alt="A row of laundromat dryers, each window a blue screen on a different episode: S1E3, S3E8, S2E1, S4E2, S2E5 and S1E9. Everyone's on a different cycle. Watch at your own pace. infomercial.nyc"><i class="tape a" aria-hidden="true"></i><i class="tape b" aria-hidden="true"></i></div>
    </div>
    <div class="slot" aria-roledescription="slide" aria-label="Poster 6 of 8" hidden>
      <div class="bill pic t6"><img data-src="posters/tile.webp" width="1080" height="1350" alt="Episode 5, set in subway tile. Get off at your stop. The finale isn't going anywhere. infomercial.nyc"><i class="tape a" aria-hidden="true"></i><i class="tape b" aria-hidden="true"></i></div>
    </div>
    <div class="slot" aria-roledescription="slide" aria-label="Poster 7 of 8" hidden>
      <div class="bill pic t7"><img data-src="posters/wait.webp" width="1080" height="1350" alt="The angel on Bethesda Fountain in Central Park, shown up to the sixth of ten blocks, with the rest as snow. Worth the wait. You'll see the rest when you get there. infomercial.nyc"><i class="tape a" aria-hidden="true"></i><i class="tape b" aria-hidden="true"></i></div>
    </div>
    <div class="slot" aria-roledescription="slide" aria-label="Poster 8 of 8" hidden>
      <div class="bill pic t8"><img data-src="posters/stops.webp" width="1080" height="1350" alt="Season 2 Local, all stops. You are here, at episode 5, and three friends at episode 8. Your friends are three stops ahead. Nobody's saying a word. Making all stops. infomercial.nyc"><i class="tape a" aria-hidden="true"></i><i class="tape b" aria-hidden="true"></i></div>
    </div>
    <!-- The two keys that change it: either side of it, or under it on a
         phone. -->
    <button class="chev prev" id="prev" type="button" aria-label="Previous poster" hidden><svg viewBox="0 0 12 22" aria-hidden="true"><polyline points="10,2 2,11 10,20"/></svg></button>
    <button class="chev next" id="next" type="button" aria-label="Next poster" hidden><svg viewBox="0 0 12 22" aria-hidden="true"><polyline points="2,2 10,11 2,20"/></svg></button>
  </section>

  <!-- One line under the bill, and it is always the same height: the pips
       and what is coming, the pips and somewhere to type the password, or
       the way in. -->
  <div class="row" id="row" data-state="soon">
    <div class="line">
      <!-- The app's four pips, coloured in one at a time: a ring until it is
           filled, a disc once it is. -->
      <svg class="pips" viewBox="0 0 85 22" aria-hidden="true">
        <g class="rings" filter="url(#c2)" fill="none" stroke="#1B33D6" stroke-width="1.7"><circle class="r1" cx="11" cy="11" r="7.4"/><circle class="r2" cx="32" cy="10.4" r="7.4"/><circle class="r3" cx="53" cy="11.5" r="7.4"/><circle class="r4" cx="74" cy="10.8" r="7.4"/></g>
        <g class="discs" filter="url(#c1)" fill="#D92027"><circle class="d1" cx="11" cy="11" r="7.8"/><circle class="d2" cx="32" cy="10.4" r="7.8"/><circle class="d3" cx="53" cy="11.5" r="7.8"/><circle class="d4" cx="74" cy="10.8" r="7.8"/></g>
      </svg>
      <!-- The two take the same room, so the pips never move. -->
      <div class="say">
        <p class="soon">Coming soon to the App Store</p>
        <div class="ask">
          <input class="word" id="word" type="text" placeholder="password here" aria-label="Early access password" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="go">
          <button class="mini" id="enter" type="button">Enter</button>
          <button class="mini" id="nvm" type="button" aria-label="Never mind">NVM</button>
        </div>
      </div>
    </div>
    <a class="key loud" id="in" href="#">Open TestFlight</a>
  </div>
</main>

<!-- The foot: the way in early, and the small print. -->
<nav class="links" aria-label="Early access and the small print">
  <button id="early" type="button" aria-expanded="false" aria-controls="row">Early access</button>
  <span class="small">
    <a href="https://obishhh.github.io/rabbitears-site/">Support</a>
    <a href="https://obishhh.github.io/rabbitears-site/terms.html">Terms</a>
    <a href="https://obishhh.github.io/rabbitears-site/privacy.html">Privacy</a>
  </span>
</nav>

<script src="site.js?v=2"></script>
<script src="posters.js?v=2"></script>
</body>
</html>
